services:
  mewly-web:
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    image: mewly-web
    container_name: mewly-web
    restart: unless-stopped
    ports:
      - "${MEWLY_WEB_PORT:-5177}:5177"
    environment:
      - HOST_IP=${HOST_IP:-192.168.0.10}
      - VITE_BABYCAT_HOST=${HOST_IP:-192.168.0.10}
    volumes:
      - .:/app

  mewly-android:
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/android/Dockerfile
    image: mewly-android
    container_name: mewly-android
    profiles:
      - android
    volumes:
      - .:/app
      - android_node_modules:/app/node_modules

volumes:
  android_node_modules:
